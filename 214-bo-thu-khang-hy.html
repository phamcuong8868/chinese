<!doctype html>
<html lang="vi">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>214 bộ thủ Khang Hy (dạng chữ Khải thư)</title>
    <link rel="stylesheet" href="214-bo-thu-khang-hy_files/about.css?v=dev13">
    <link rel="stylesheet" href="214-bo-thu-khang-hy_files/step.css?v=dev13">
    <link rel="stylesheet" href="214-bo-thu-khang-hy_files/test.css?v=dev13">
    <link rel="stylesheet" href="214-bo-thu-khang-hy_files/draw.css?v=dev13">
</head>
<body>
    <main id="main">
        <div class="return-button image-button" onclick="document.getElementById('menuScreen').style.display='block';">🏠</div>
        <div id="result" aria-live="polite"><div class="blank">Chọn ngẫu nhiên hoặc dùng các nút điều hướng để xem bộ thủ.</div></div>

        <nav class="media-controls" aria-label="Điều hướng bộ thủ">
            <button id="firstBtn" class="move-btn" type="button" aria-label="Về bộ đầu tiên" title="Về bộ đầu tiên">⏮</button>
            <button id="prevBtn" class="move-btn" type="button" aria-label="Bộ trước" title="Bộ trước">◀</button>
            <div id="randomBtn" aria-live="polite" style="font-size:28px;text-align:center;" class="image-button">🎲</div>
            <button id="nextBtn" class="move-btn" type="button" aria-label="Bộ tiếp theo" title="Bộ tiếp theo">▶</button>
            <button id="lastBtn" class="move-btn" type="button" aria-label="Đến bộ cuối cùng" title="Đến bộ cuối cùng">⏭</button>
        </nav>

        <div id="divCheDraw" class="div-che" onclick="hideDraw();"></div>
        <div id="draw" class="draw">  
            <div class="draw__controlPannel" style="margin-bottom: 10px;">
                <div id="randomBtn2" aria-live="polite" style="font-size:28px;text-align:center;" class="image-button" onclick="chooseRandom();">🎲</div>

                <label>
                    <div id="choseColor_button">
                        <input type="color" id="color" style="display: none;" value="#000000">
                        <span id="draw_penSize_div">&nbsp;</span>
                    </div>             
                </label>

                <input type="range" id="size" style="width:100px;accent-color: black;"
                    min="1" max="10" value="4">              

                <div class="button" style="padding: 2px 6px;" id="clear">🗑</div>
                <div></div>
                <div class="image-button" style="padding: 2px 6px;" onclick="hideDraw();">&#10005</div>
            </div>            

            <canvas id="canvas"></canvas>
            
        </div>
    </main>
    <test id="test">

    </test>
    <script>
        "use strict";   
        var newWord = false;     
    </script>
    <script src="214-bo-thu-khang-hy_files/step.js?v=dev13"></script>
    <script src="214-bo-thu-khang-hy_files/about.js?v=dev13"></script>
    <script src="214-bo-thu-khang-hy_files/test.js?v=dev13"></script> 
    <script src="214-bo-thu-khang-hy_files/draw.js?v=dev13"></script>      
</body>
</html>
