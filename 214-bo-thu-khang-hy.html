
<!doctype html>
<html lang="vi">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>214 bộ thủ Khang Hy (dạng chữ Khải thư)</title>
    <link rel="stylesheet" href="214-bo-thu-khang-hy_files/about.css?v=dev11">
    <link rel="stylesheet" href="214-bo-thu-khang-hy_files/step.css?v=dev11">
    <link rel="stylesheet" href="214-bo-thu-khang-hy_files/test.css?v=dev11">
    <link rel="stylesheet" href="214-bo-thu-khang-hy_files/draw.css?v=dev11">
</head>
<body>    
    <main id="main">
        <div class="return-button image-button" onclick="document.getElementById('menuScreen').style.display='block';">🏠</div>
        <div id="result" aria-live="polite"><div class="blank">Chọn ngẫu nhiên hoặc dùng các nút điều hướng để xem bộ thủ.</div></div>

        <nav class="media-controls" aria-label="Điều hướng bộ thủ">
            <button id="firstBtn" class="move-btn" type="button" aria-label="Về bộ đầu tiên" title="Về bộ đầu tiên">⏮</button>
            <button id="prevBtn" class="move-btn" type="button" aria-label="Bộ trước" title="Bộ trước">◀</button>
            <div id="randomBtn" aria-live="polite" style="font-size:28px;text-align:center;" class="image-button">🎲</div>
            <button id="nextBtn" class="move-btn" type="button" aria-label="Bộ tiếp theo" title="Bộ tiếp theo">▶</button>
            <button id="lastBtn" class="move-btn" type="button" aria-label="Đến bộ cuối cùng" title="Đến bộ cuối cùng">⏭</button>
        </nav>

        <div id="draw" class="draw">
            <div class="toolbar">
                <div class="button" style="padding: 2px 6px;" id="clear">Xóa</div>
                <div class="button" style="padding: 2px 6px;" id="save">Lưu PNG</div>
                <div class="button" style="padding: 2px 6px;" onclick="document.getElementById('draw').style.display='none';">Đóng</div>
            </div>
            <div class="toolbar">
                    <input type="color" id="color" value="#000000">
                    <input type="range" id="size"
                        min="1" max="10" value="4">
                    <span id="sizeValue">4 px</span>
            </div>
            <canvas id="canvas"></canvas>
        </div>
    </main>
    <test id="test">

    </test>
    <script src="214-bo-thu-khang-hy_files/step.js?v=dev11"></script>
    <script src="214-bo-thu-khang-hy_files/about.js?v=dev11"></script>
    <script src="214-bo-thu-khang-hy_files/test.js?v=dev11"></script> 
    <script src="214-bo-thu-khang-hy_files/draw.js?v=dev11"></script>  

    <script>
        "use strict";
    </script>
</body>
</html>
